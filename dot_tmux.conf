# Change prefix from Ctrl+b to Ctrl+a
unbind C-b
set -g prefix C-q
bind C-q send-prefix

# Reload config file quickly with Prefix + o
bind o source-file ~/.tmux.conf \; display "Config reloaded!"

# Intuitive pane splitting (| for vertical, - for horizontal)
unbind '"'
unbind %
bind r split-window -h
bind d split-window -v

# Vim-style pane navigation (Prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
